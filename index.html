<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이기광 포트폴리오</title>
  <meta name="description" content="STM32 펌웨어, Verilog RTL 설계, RISC-V CPU, UVM 검증 프로젝트 포트폴리오">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a class="wordmark" href="#top">이기광</a>
    <nav aria-label="주요 메뉴">
      <a href="#projects">프로젝트</a>
      <a href="#labs">실습 기록</a>
      <a href="#contact">연락처</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <h1>LED 점멸에서<br>RISC-V CPU까지</h1>
      <div class="hero-side">
        <p>이기광의 포트폴리오입니다. STM32 펌웨어, Verilog RTL 설계, UVM 검증까지 직접 만들고 검증한 프로젝트를 모았습니다.</p>
        <a class="button" href="#projects">프로젝트 보기</a>
      </div>
      <figure class="hero-figure">
        <img src="assets/cpu-architecture.png" width="1760" height="890" alt="RV32I 멀티사이클 CPU 구조도. 명령어 ROM, 제어부와 데이터패스, APB requester, 메모리 맵으로 이어진다.">
        <figcaption>직접 설계한 RV32I 멀티사이클 CPU 구조도</figcaption>
      </figure>
    </section>

    <section id="projects" aria-labelledby="projects-title">
      <h2 class="section-title" id="projects-title">프로젝트</h2>
      <div id="works"></div>
      <noscript><p class="section-title">프로젝트 목록을 보려면 JavaScript를 켜 주세요.</p></noscript>
    </section>

    <section id="labs" class="labs" aria-labelledby="labs-title">
      <h2 id="labs-title">실습 기록</h2>
      <p class="labs-intro">프로젝트로 이어진 단계별 실습입니다. 각 저장소 폴더의 README에 동작과 구현 내용을 정리했습니다.</p>
      <div id="lab-groups"></div>
    </section>
  </main>

  <footer id="contact">
    <h2>연락처</h2>
    <div class="contact-links" id="contact-links"></div>
    <p class="closing-name" aria-hidden="true">이기광</p>
  </footer>

  <script src="projects.js"></script>
  <script src="app.js"></script>
</body>
</html>
